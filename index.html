
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrida 3D</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial;
}
#painel {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  background: #111c;
  padding: 15px;
  border-radius: 12px;
  z-index: 2;
}
button {
  background: #00bb55;
  border: 0;
  padding: 12px 20px;
  color: white;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}
#winner {
  font-size: 20px;
  color: yellow;
  margin-top: 10px;
}
</style>
</head>
<body>

<div id="painel">
  <h2>🏁 CORRIDA 3D</h2>
  <div id="status">5 carros prontos!</div>
  <button onclick="startRace()">INICIAR CORRIDA</button>
  <div id="winner"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 65, 150);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth/window.innerHeight, 0.1, 300
);
camera.position.set(0, 28, 32);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Iluminação
scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2));

const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(20,35,20);
sun.castShadow = true;
scene.add(sun);

// Chão
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x258b38})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

// Pista com curvas
const points = [
  new THREE.Vector3(-22,0,-12),
  new THREE.Vector3(-12,0,-22),
  new THREE.Vector3(8,0,-23),
  new THREE.Vector3(25,0,-12),
  new THREE.Vector3(24,0,4),
  new THREE.Vector3(12,0,20),
  new THREE.Vector3(-7,0,22),
  new THREE.Vector3(-24,0,12),
  new THREE.Vector3(-27,0,-3)
];

const track = new THREE.CatmullRomCurve3(
  points,true,'catmullrom',0.5
);

const segments = 500;
const roadWidth = 10;
const vertices = [];
const indices = [];

for(let i=0;i<=segments;i++){
  const t=i/segments;
  const p=track.getPointAt(t);
  const tangent=track.getTangentAt(t);
  const side=new THREE.Vector3(
    tangent.z,0,-tangent.x
  ).normalize();

  const left=p.clone().addScaledVector(side,roadWidth/2);
  const right=p.clone().addScaledVector(side,-roadWidth/2);

  vertices.push(left.x,0.02,left.z);
  vertices.push(right.x,0.02,right.z);

  if(i<segments){
    const n=i*2;
    indices.push(n,n+1,n+2,n+1,n+3,n+2);
  }
}

const roadGeometry = new THREE.BufferGeometry();
roadGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(vertices,3)
);
roadGeometry.setIndex(indices);
roadGeometry.computeVertexNormals();

const road = new THREE.Mesh(
  roadGeometry,
  new THREE.MeshStandardMaterial({
    color:0x333333,
    side:THREE.DoubleSide,
    roughness:0.9
  })
);
road.receiveShadow=true;
scene.add(road);

// Bordas da pista
function createEdge(offset,color){
  const pts=[];
  for(let i=0;i<=segments;i++){
    const p=track.getPointAt(i/segments);
    const t=track.getTangentAt(i/segments);
    const side=new THREE.Vector3(t.z,0,-t.x).normalize();
    p.addScaledVector(side,offset);
    p.y=0.15;
    pts.push(p);
  }
  const line=new THREE.Mesh(
    new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts),segments,0.18,6,true
    ),
    new THREE.MeshStandardMaterial({color})
  );
  scene.add(line);
}
createEdge(5.2,0xffffff);
createEdge(-5.2,0xffffff);

// Faixa de largada
const startLine = new THREE.Mesh(
  new THREE.BoxGeometry(0.5,0.04,10),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
startLine.position.set(-22,0.12,-12);
scene.add(startLine);

// Criar carros
const colors = [
  0xff0000,
  0x0066ff,
  0xffff00,
  0xffffff,
  0xff8800
];

const cars=[];

function createCar(color){
  const car=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(2.3,0.7,4),
    new THREE.MeshStandardMaterial({
      color,metalness:0.3,roughness:0.4
    })
  );
  body.position.y=0.75;
  body.castShadow=true;
  car.add(body);

  const cabin=new THREE.Mesh(
    new THREE.BoxGeometry(1.6,0.8,1.8),
    new THREE.MeshStandardMaterial({color:0x222b38})
  );
  cabin.position.set(0,1.45,-0.2);
  cabin.castShadow=true;
  car.add(cabin);

  // Rodas
  for(const x of [-1.15,1.15]){
    for(const z of [-1.25,1.25]){
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(0.42,0.42,0.25,16),
        new THREE.MeshStandardMaterial({color:0x111111})
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,0.48,z);
      car.add(wheel);
    }
  }

  scene.add(car);
  return car;
}

for(let i=0;i<5;i++){
  cars.push({
    mesh:createCar(colors[i]),
    progress:0,
    lane:(i-2)*1.6,
    speed:0
  });
}

// Posicionar os carros
function updateCar(car){
  const p=track.getPointAt(car.progress);
  const tangent=track.getTangentAt(car.progress);
  const side=new THREE.Vector3(
    tangent.z,0,-tangent.x
  ).normalize();

  p.addScaledVector(side,car.lane);

  car.mesh.position.copy(p);
  car.mesh.position.y=0.1;

  car.mesh.rotation.y=Math.atan2(
    tangent.x,tangent.z
  );
}

cars.forEach(updateCar);

let running=false;
let winner=-1;
let lastTime=0;

function startRace(){
  running=true;
  winner=-1;

  // Sorteia o vencedor desta corrida
  const lucky=Math.floor(Math.random()*5);

  cars.forEach((car,i)=>{
    car.progress=0;
    car.speed=i===lucky ? 0.105 : 0.065+Math.random()*0.012;
    updateCar(car);
  });

  document.getElementById('winner').innerText='';
  document.getElementById('status').innerText='🏎️ CORRIDA EM ANDAMENTO!';
}

// Animação
function animate(time){
  requestAnimationFrame(animate);

  const delta=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;

  if(running){
    cars.forEach((car,i)=>{
      car.progress+=car.speed*delta;

      if(car.progress>=1 && winner===-1){
        winner=i;
        running=false;

        document.getElementById('winner').innerText=
          '🏆 VENCEDOR: CARRO '+(i+1)+'!';
        document.getElementById('status').innerText=
          'Corrida finalizada!';
      }

      updateCar(car);
    });
  }

  renderer.render(scene,camera);
}

animate(0);

// Redimensionar tela
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
